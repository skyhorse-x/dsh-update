# dsh-update: registers the host-side update checker and the browser-side
# notification banner.
#
# The host entry is loaded via package.json "main".
# The client entry is auto-detected via package.json "dsh.client" declaration.

- insert:
    - id: dsh-update
      name: dsh-update

    - id: dsh-update-client
      name: dsh-update
